name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Configure production settings
        run: |
          cat > Howestprime.Backoffice/appsettings.Production.json << EOF
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "MoviesApi": {
              "BaseUrl": "${{ vars.AZ_MOVIES_API_URL }}",
              "TimeoutSeconds": 30
            },
            "Kestrel": {
              "Endpoints": {
                "Http": {
                  "Url": "http://0.0.0.0:8080"
                }
              }
            }
          }
          EOF

      - name: Make release
        run: |
          dotnet restore
          dotnet publish Howestprime.Backoffice/Howestprime.Backoffice.csproj -c Release -o ./output

      - name: Zip the release
        run: |
          cd output
          zip -r ../deploy.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: deploy.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .

      - name: Log in to Azure
        run: az login --service-principal --username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} --password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} --tenant ${{ vars.AZ_TENANT_ID }}

      - name: Unzip deployment package
        run: unzip deploy.zip -d ./deploy
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ vars.AZ_BACKOFFICE_WEBAPP }}
          package: ./deploy