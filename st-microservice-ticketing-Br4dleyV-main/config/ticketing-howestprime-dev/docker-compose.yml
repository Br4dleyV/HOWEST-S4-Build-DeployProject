# Network config
networks:
  ticketing-howestprime-dev:
    ipam:
      config:
      # Subnet for the ticketing-howestprime-dev network
        - subnet: 10.21.0.0/16
  
services:
  ticketing-db.howestprime.dev:
    image: mongo:latest
    # Network configuration for the ticketing-db service
    networks:
      - ticketing-howestprime-dev
    # Volume to persist the database data
    volumes:
      - ../../data:/data/db
    # Env file for the ticketing-db service
    env_file:
      - .ticketing-db.howestprime.dev.env
    # Port mapping for the ticketing-db service
    ports:
      - "40131:5000" # Database Port
    # Restart policy for the ticketing-db service
    restart: always
    # Enable database transactions for MongoDB
    command: >
      bash -c "
        mongod --port 5000 --replSet rs0 --bind_ip_all &
        until mongosh --port 5000 --eval 'print(\"waited for connection\")'
        do
          sleep 1
        done
        mongosh --port 5000 --eval 'rs.initiate({
          _id: \"rs0\",
          members: [{ _id: 0, host: \"ticketing-db.howestprime.dev:5000\" }]
        })'
        wait
      "
    # Health check because setting up MongoDB transactions takes a while
    healthcheck:
      test: ["CMD-SHELL", "mongosh --port 5000 --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

  messagebroker.howestprime.dev:
    image: cloudamqp/lavinmq
    # Network configuration for the messagebroker service
    networks:
      - ticketing-howestprime-dev
    # Port mapping for the messagebroker service
    ports:
      - "40100:5672" # AMQP Port
      - "40101:15672" # LavinMQ GUI
    # Health check for the messagebroker service
    healthcheck:
      test: ["CMD-SHELL", "lavinmqctl status | grep -q 'Uptime: ' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 40s

# Volume config
volumes:
  mongo-data: