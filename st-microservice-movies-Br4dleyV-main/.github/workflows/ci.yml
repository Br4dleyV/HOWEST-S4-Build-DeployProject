name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run unit tests
      run: dotnet test --configuration Release --verbosity normal

  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Run tests with coverage
      run: dotnet test --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:Threshold=97 /p:ThresholdType=line "/p:Include=[Howestprime.Movies.Application]*%2C[Howestprime.Movies.Domain]*"

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: test/UnitTests/coverage.opencover.xml

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Azure Container Registry
        run: echo ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} | docker login ${{ vars.AZ_CONTAINER_REGISTRY }} -u ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} --password-stdin

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and push Docker image
        run: |
          docker build -t ${{ vars.AZ_CONTAINER_REGISTRY }}/movies:latest .
          docker push ${{ vars.AZ_CONTAINER_REGISTRY }}/movies:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        run: az login --service-principal --username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} --password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} --tenant ${{ vars.AZ_TENANT_ID }}

      - name: Deploy to Azure Container Apps
        run: |
          if az containerapp show \
            --name hp-wide-p-movies \
            --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
            --output none 2>/dev/null; then

            az containerapp update \
            --name hp-wide-p-movies \
            --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
            --image ${{ vars.AZ_CONTAINER_REGISTRY }}/movies:latest \
            --set-env-vars \
            "ASPNETCORE_ENVIRONMENT=Production" \
            "MessageBroker__Port=5672" \
            "Database__Password=secretref:db-password" \
            "Database__Username=${{ vars.HOWESTPRIME_MOVIES_P_PSQL_LOGIN }}" \
            "Database__ConnectionString=${{ vars.HOWESTPRIME_MOVIES_P_PSQL_CONNECTION_STRING }}" \
            "MessageBroker__Hostname=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_HOSTNAME }}" \
            "MessageBroker__VirtualHost=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_VHOST }}" \
            "MessageBroker__Password=secretref:mb-password" \
            "MessageBroker__Username=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_LOGIN }}"

          else

            az containerapp create \
            --name hp-wide-p-movies \
            --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
            --environment ${{ vars.AZ_CONTAINER_ENVIRONMENT }} \
            --image ${{ vars.AZ_CONTAINER_REGISTRY }}/movies:latest \
            --registry-server ${{ vars.AZ_CONTAINER_REGISTRY }} \
            --registry-username ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL }} \
            --registry-password ${{ secrets.HOWESTPRIME_WIDE_CI_SERVICE_PRINCIPAL_PASSWORD }} \
            --user-assigned "${{ vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI }}" \
            --secrets \
            "db-password=keyvaultref:${{ vars.HOWESTPRIME_MOVIES_P_SQLSRV_PASSWORD_URI }},identityref:${{ vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI }}" \
            "mb-password=keyvaultref:${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_PASSWORD_URI }},identityref:${{ vars.HOWESTPRIME_WIDE_MI_KEYVAULTREADER_URI }}" \
            --env-vars \
            "ASPNETCORE_ENVIRONMENT=Production" \
            "MessageBroker__Port=5672" \
            "Database__Password=secretref:db-password" \
            "Database__Username=${{ vars.HOWESTPRIME_MOVIES_P_PSQL_LOGIN }}" \
            "Database__ConnectionString=${{ vars.HOWESTPRIME_MOVIES_P_PSQL_CONNECTION_STRING }}" \
            "MessageBroker__Hostname=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_HOSTNAME }}" \
            "MessageBroker__VirtualHost=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_VHOST }}" \
            "MessageBroker__Password=secretref:mb-password" \
            "MessageBroker__Username=${{ vars.HOWESTPRIME_WIDE_P_MESSAGEBROKER_LOGIN }}"

            az containerapp ingress enable \
            --name hp-wide-p-movies \
            --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
            --type external \
            --target-port 8000

          fi

          # Always ensure ingress is enabled with the correct settings, in case of updates to the app configuration
          az containerapp ingress enable \
          --name hp-wide-p-movies \
          --resource-group ${{ vars.AZ_RESOURCE_GROUP }} \
          --type external \
          --target-port 8000 \
          --transport http